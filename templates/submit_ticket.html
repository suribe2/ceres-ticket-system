
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Support Ticket</title>
</head>
<body>

    <h1>Submit a Support Ticket</h1>

    <!-- Display validation and database error messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('submit_ticket') }}">

        <!-- CSRF protection -->
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <!-- Employee email -->
        <label for="employee_email">Employee Email:</label>
        <input
            type="email"
            id="employee_email"
            name="employee_email"
            value="{{ form_data.employee_email }}"
            required
        >

        <br><br>

        <!-- Priority -->
        <label for="priority">Priority:</label>
        <select id="priority" name="priority" required>
            <option value="" disabled
                {% if not form_data.priority %}selected{% endif %}>
                Select Priority
            </option>

            {% for level in ["Low", "Medium", "High"] %}
                <option value="{{ level }}"
                    {% if form_data.priority == level %}selected{% endif %}>
                    {{ level }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <!-- Equipment -->
        <label for="equipment">Equipment:</label>
        <input
            type="text"
            id="equipment"
            name="equipment"
            value="{{ form_data.equipment }}"
            required
        >

        <br><br>

        <!-- Description -->
        <label for="description">Description:</label>
        <textarea
            id="description"
            name="description"
            rows="5"
            cols="40"
            required
        >{{ form_data.description }}</textarea>

        <br><br>

        <button type="submit">Submit Ticket</button>

    </form>

</body>
</html>
